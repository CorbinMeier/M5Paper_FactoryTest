; PlatformIO Project Configuration
;
; Monorepo layout (issues #84, #85, #86):
;   lib/m5paper-ui/   the library -- PlatformIO's LDF discovers it automatically
;   apps/<name>/      one application per directory, one [env:] each
;
; Selective compilation rests on three mechanisms, in order of leverage:
;   1. The Library Dependency Finder resolves by #include, so a module no app
;      includes is never compiled. This is most of the win and it is free.
;   2. -ffunction-sections/-fdata-sections + --gc-sections drop unreferenced
;      code from the final image.
;   3. -D feature gates, only where 1 and 2 cannot reach.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = demo-all

; ---------------------------------------------------------------- shared ----
; Deliberately NOT named [env]: that name is the implicit base for *every*
; environment, so [env:native] would inherit board/framework/lib_deps and fail
; with "Unknown board ID 'm5stack-fire'" (issue #98). Embedded envs opt in with
; `extends = esp32_base`; the host env inherits nothing.

[esp32_base]
platform = espressif32@5.2.0
board = m5stack-fire
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20004.0
board_build.partitions = default_16MB.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -std=gnu++17
    ; Dead-code stripping. Without these, unreferenced functions and data stay
    ; in the image even when nothing calls them.
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
build_unflags =
    -std=gnu++11

; Pinned rather than floating, so a build is reproducible (issue #11).
lib_deps =
    m5stack/M5EPD@0.1.5

lib_ldf_mode = chain+

; ------------------------------------------------------------------ apps ----

[env:demo-all]
extends = esp32_base
build_src_filter = +<../apps/demo-all/src/>
build_flags =
    ${esp32_base.build_flags}
    -DAPP_DEMO_ALL
    -DCORE_DEBUG_LEVEL=3

[env:demo-all-debug]
extends = env:demo-all
build_type = debug
build_flags =
    ${env:demo-all.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DM5UI_DEBUG_LAYOUT

; Placeholder for the first real target (issue #90). Uncomment once
; apps/notes/ exists; it should come out dramatically smaller than demo-all,
; and that claim is the whole premise of the restructure -- measure it (#86).
;
; [env:notes]
; build_src_filter = +<../apps/notes/src/>
; extends = esp32_base
; build_flags = ${esp32_base.build_flags} -DAPP_NOTES

; NimBLE-Arduino, not the stock BLEDevice.h: this device's internal DRAM is
; the scarce pool, and a spike (issue #112) measured NimBLE's footprint at
; ~19 KB for a bare advertiser with the largest free block untouched --
; comfortably affordable, well under Bluedroid's typical cost.
[env:calendar-demo]
extends = esp32_base
build_src_filter = +<../apps/calendar-demo/src/>
lib_deps =
    ${esp32_base.lib_deps}
    h2zero/NimBLE-Arduino@^2.5.1
build_flags =
    ${esp32_base.build_flags}
    -DAPP_CALENDAR_DEMO
    -DM5UI_ENABLE_BLE_COMPANION
    -DCORE_DEBUG_LEVEL=3

[env:image-preview-demo]
extends = esp32_base
build_src_filter = +<../apps/image-preview-demo/src/>
build_flags =
    ${esp32_base.build_flags}
    -DAPP_IMAGE_PREVIEW_DEMO
    -DCORE_DEBUG_LEVEL=3

; --------------------------------------------------------------- testing ----
; Hardware-independent logic (the discharge curve, geometry, text wrapping,
; the layout solver) under a native environment (issue #17).

; Only translation units that compile without Arduino/M5EPD belong here --
; currently battery_curve.cpp, geometry.cpp and calendar_math.cpp. The tests
; include the matching headers, which declare but do not define, so the
; sources must be compiled in explicitly: test_build_src is off by default and
; would otherwise leave every symbol undefined at link time (issue #99).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<../lib/m5paper-ui/src/core/battery_curve.cpp>
    +<../lib/m5paper-ui/src/core/geometry.cpp>
    +<../lib/m5paper-ui/src/core/calendar_math.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DM5UI_HOST_BUILD
